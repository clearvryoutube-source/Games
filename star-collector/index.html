<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Collector — a clean little arcade game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
  body { background: #0b1030; color: #fff; text-align: center; padding: 20px; }
  h1 { font-size: 32px; margin-bottom: 6px; }
  p { opacity: .85; margin-bottom: 10px; }
  #hud { font-size: 20px; font-weight: 700; margin: 10px 0; }
  #game { background: #141b4d; border: 3px solid #ffd700; border-radius: 12px; display: block; margin: 0 auto; max-width: 96vw; }
  button { background: #ffd700; color: #0b1030; border: none; font-weight: 800; font-size: 18px; padding: 10px 20px; border-radius: 20px; cursor: pointer; margin-top: 12px; }
  .note { font-size: 14px; opacity: .7; margin-top: 12px; }
</style>
</head>
<body>
<h1>⭐ Star Collector</h1>
<p>Collect 20 stars in 60 seconds. Dodge the red blocks. Move with WASD or arrow keys, or touch / click to move.</p>
<div id="hud">⭐ Stars: 0 / 20 &nbsp;•&nbsp; ⏱️ Time: 60s &nbsp;•&nbsp; ❤️ Lives: 3</div>
<canvas id="game" width="640" height="400"></canvas>
<br><button onclick="startGame()">▶ Play again</button>
<p class="note">A clean, family-friendly original game by Muse for ClearVRGT. No ads, no sign-in, no downloads — just play.</p>
<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let player, stars, blocks, keys = {}, score = 0, lives = 3, timeLeft = 60, timer = null, running = false;
function reset() {
  player = { x: 300, y: 180, r: 16, speed: 4 };
  stars = []; blocks = [];
  for (let i = 0; i < 5; i++) stars.push(newStar());
  for (let i = 0; i < 5; i++) blocks.push({ x: Math.random()*600, y: Math.random()*360, vx: (Math.random()*2+1)*(Math.random()<.5?-1:1), vy: (Math.random()*2+1)*(Math.random()<.5?-1:1), s: 24 });
  score = 0; lives = 3; timeLeft = 60;
}
function newStar() { return { x: 20+Math.random()*600, y: 20+Math.random()*360, r: 12 }; }
function startGame() {
  reset(); running = true;
  clearInterval(timer);
  timer = setInterval(() => { timeLeft--; if (timeLeft <= 0) endGame(score >= 20 ? 'You win! 🎉 You collected 20 stars!' : 'Time up! You collected ' + score + ' stars. Try again!'); }, 1000);
  requestAnimationFrame(loop);
}
function endGame(msg) {
  running = false; clearInterval(timer);
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#ffd700'; ctx.font = '28px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(msg, 320, 200);
}
function loop() {
  if (!running) return;
  if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
  player.x = Math.max(16, Math.min(624, player.x));
  player.y = Math.max(16, Math.min(384, player.y));
  blocks.forEach(b => {
    b.x += b.vx; b.y += b.vy;
    if (b.x < 0 || b.x > 616) b.vx *= -1;
    if (b.y < 0 || b.y > 376) b.vy *= -1;
    if (Math.abs(player.x-b.x) < 28 && Math.abs(player.y-b.y) < 28) {
      lives--; player.x = 300; player.y = 180;
      if (lives <= 0) endGame('Game over! You collected ' + score + ' stars.');
    }
  });
  stars.forEach((s, i) => {
    if (Math.hypot(player.x-s.x, player.y-s.y) < 28) { score++; stars[i] = newStar(); }
  });
  if (score >= 20) endGame('You win! 🎉 You collected 20 stars!');
  document.getElementById('hud').textContent = '⭐ Stars: ' + score + ' / 20  •  ⏱️ Time: ' + timeLeft + 's  •  ❤️ Lives: ' + lives;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#ffd700';
  stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); });
  ctx.fillStyle = '#ff4d4d';
  blocks.forEach(b => ctx.fillRect(b.x, b.y, b.s, b.s));
  ctx.fillStyle = '#00e5ff';
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
  requestAnimationFrame(loop);
}
document.addEventListener('keydown', e => { keys[e.key] = true; if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });
cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); player.x = (e.clientX-r.left) * (cv.width/r.width); player.y = (e.clientY-r.top) * (cv.height/r.height); });
reset(); startGame();
</script>
</body>
</html>
